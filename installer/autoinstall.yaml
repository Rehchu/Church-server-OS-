#cloud-config
# =============================================================================
#  Arise Server — hands-off Ubuntu Server 24.04 install (subiquity autoinstall)
#
#  Put this file, named exactly  autoinstall.yaml , in the root of the Ubuntu
#  Server USB stick (see MAKE-USB.md). Boot the old PC from the stick, pick
#  "Try or Install Ubuntu Server", and walk away. It will:
#    - WIPE THE FIRST DISK and install Ubuntu Server 24.04 LTS on LVM
#    - hostname arise-server, timezone America/Chicago, user "bradly"
#    - install OpenSSH, git, python
#    - on first boot: clone this repo to /opt/arise and run install.sh --no-start
#
#  Before using it, replace the password hash below. Generate one on any Linux
#  or Mac terminal:
#      openssl passwd -6 'the-password-you-want'
#  and paste the whole $6$... line in place of REPLACE_WITH_HASH.
#  The domain Administrator password is asked for later, by install.sh.
# =============================================================================
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: America/Chicago

  identity:
    hostname: arise-server
    username: bradly
    realname: Bradly Dyer
    # openssl passwd -6 '...'  → paste the result here (keep the quotes)
    password: "REPLACE_WITH_HASH"

  ssh:
    install-server: true
    allow-pw: true

  # Whole-disk LVM on the first disk the installer finds. If the PC has more
  # than one disk, pin it: replace "match: size: largest" with
  #   match: { path: /dev/sda }   (or whatever `lsblk` shows on the live USB).
  storage:
    layout:
      name: lvm
      sizing-policy: all
      match:
        size: largest

  # A domain controller wants a wired interface with a fixed address. DHCP here
  # gets the install done; INSTALL.md step "Fixed address" pins it afterwards
  # (or set a DHCP reservation on the router for this MAC).
  network:
    version: 2
    ethernets:
      all-wired:
        match:
          name: "en*"
        dhcp4: true

  packages:
    - git
    - python3
    - python3-venv
    - curl
    - ca-certificates

  updates: security

  late-commands:
    # Fetch the server code into the installed system and run the installer
    # with --no-start --skip-domain: packages, venv, config, units — but the
    # domain is provisioned on first login, where install.sh can ask for the
    # Administrator password and check the wired address.
    - curtin in-target --target=/target -- git clone --depth 1 https://github.com/Rehchu/Church-server-OS-.git /opt/arise
    - curtin in-target --target=/target -- bash -c 'bash /opt/arise/installer/install.sh --no-start --skip-domain --skip-docker >/var/log/arise-autoinstall.log 2>&1 || echo "install.sh failed, see /var/log/arise-autoinstall.log" >> /etc/motd'
    - curtin in-target --target=/target -- bash -c 'printf "\n  Arise Server: finish the install with\n      sudo bash /opt/arise/installer/install.sh\n  (asks for the domain Administrator password). See /opt/arise/INSTALL.md\n\n" >> /etc/motd'

  shutdown: reboot
