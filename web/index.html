<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arise Server</title>
<meta name="description" content="The Arise Church server desktop: directory, files, backups, the YouTube automator, sermons, Bible, apps, remote access, the campuses and the Synology, in one place.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/assets/vendor/xterm.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="desk" id="desk">
  <div class="wall" aria-hidden="true"><div class="wall__glow"></div><div class="wall__grid"></div><div class="wall__foot"></div></div>

  <header class="bar" id="bar">
    <button class="bar__logo" id="barLogo" aria-label="Launchpad" title="Launchpad"><svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M16 2c2 6 8 8 8 15a8 8 0 0 1-16 0c0-3 1.4-5 3-7 0 3 1 5 3 6 0-5 1-10 2-14z" fill="#D6222D"/><path d="M16 12c1 3 4 4 4 7.5A4 4 0 0 1 12 19c0-2 .7-3 1.6-4 .2 1.6.9 2.5 1.8 3 0-2.5.3-4.5.6-6z" fill="#fff"/></svg></button>
    <span class="bar__app" id="barApp">Arise Server</span>
    <span class="bar__host" id="barHost">arise-server</span>
    <span class="bar__spacer"></span>
    <span class="bar__pill" id="barAtt" hidden><i></i><b id="barAttN">0</b><span class="bar__pilltxt">needs you</span></span>
    <span class="bar__stat" title="CPU"><i>CPU</i><b id="miniCpu">–</b></span>
    <span class="bar__stat" title="Memory"><i>RAM</i><b id="miniRam">–</b></span>
    <span class="bar__stat bar__stat--wide" title="Uptime"><i>UP</i><b id="miniUp">–</b></span>
    <span class="bar__live" id="sideLive"><span class="live__dot"></span><span id="sideLiveText">…</span></span>
    <span class="demo-badge" id="demoBadge" hidden>Sample data</span>
    <span class="bar__clock" id="barClock">—</span>
    <button class="bar__user" id="userBtn" aria-label="Account">bradly</button>
  </header>

  <main class="stage" id="stage">
    <aside class="widgets" id="widgets" aria-label="Desktop widgets"></aside>
  </main>

  <nav class="dock" id="dock" aria-label="Apps"></nav>

  <div class="launchpad" id="launchpad" hidden>
    <div class="launchpad__in">
      <div class="mark mark--l"><span class="kicker">Arise Server · every app</span></div>
      <input class="launchpad__q" id="lpQ" placeholder="Type to find an app" autocomplete="off">
      <div class="launchpad__grid" id="lpGrid"></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="modal" class="modal"><div id="modalBody"></div></dialog>

<script src="/assets/vendor/xterm.js"></script>
<script src="/assets/vendor/xterm-addon-fit.js"></script>
<script src="/assets/demo-data.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
