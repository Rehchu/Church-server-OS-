<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist · Arise Church</title><meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
<style>
/* The phone checklist (round 7, 19, 88, 89). Staff and volunteers use their Macs, not the
   desktop; this page is the one thing they open on the dashboard, on church Wi-Fi or with
   Tailscale on: their department's checklist for the next service, ticked with a thumb. */
html,body{min-height:100%;margin:0;background:var(--ink);color:var(--text)}
body{padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) calc(24px + env(safe-area-inset-bottom,0)) max(16px,env(safe-area-inset-left,0))}
.cl{max-width:560px;margin:0 auto}
.cl__top{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.cl__top h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cl__top .who{margin-left:auto;font-size:13px;color:var(--text2);text-align:right}
.cl__top .who button{background:none;border:0;color:var(--redL);font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 0;cursor:pointer;min-height:36px}
.cl__svc{margin:16px 0 4px;padding:12px 14px;background:var(--panel);border-left:3px solid var(--red);font-size:15px}
.cl__svc b{font-weight:500;color:#fff}
.cl__list{margin-top:18px;background:var(--panel);border-top:3px solid var(--red)}
.cl__list h2{display:flex;align-items:baseline;gap:10px;margin:0;padding:14px 14px 8px;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.cl__list h2 small{margin-left:auto;font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.04em;color:var(--text2);text-transform:none;font-variant-numeric:tabular-nums}
.cl__list.done h2 small{color:var(--ok)}
.cl__note{padding:0 14px 10px;font-size:13.5px;color:var(--muted)}
.cl__item{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px;color:var(--text);font:inherit;font-size:17px;line-height:1.35;cursor:pointer;min-height:56px}
.cl__item:disabled{cursor:default;opacity:.75}
.cl__box{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:-1px}
.cl__item.on .cl__box{background:var(--red);border-color:var(--red)}
.cl__item.on .cl__box::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.cl__item.on .cl__t{color:var(--text2);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.cl__by{display:block;font-size:12.5px;color:var(--muted);text-decoration:none;margin-top:2px}
.cl__empty{padding:16px 14px;color:var(--text2)}
.cl__sign{margin-top:40px;background:var(--panel);border-top:3px solid var(--red);padding:24px 20px}
.cl__sign h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:26px;text-transform:uppercase;margin:0 0 6px}
.cl__sign p{color:var(--text2);margin:0 0 16px;font-size:15px}
.cl__sign label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin:12px 0 4px}
.cl__sign input{width:100%;box-sizing:border-box;background:var(--ink);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:17px;padding:12px;min-height:48px}
.cl__sign .btn{width:100%;margin-top:18px;min-height:50px;font-size:13px}
.cl__err{color:var(--redL);margin-top:12px;font-size:14px;min-height:1.2em}
.cl__lead{margin-top:26px;background:var(--panel);padding:14px}
.cl__lead h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:18px;text-transform:uppercase;margin:0 0 6px}
.cl__lead p{margin:0 0 10px;color:var(--text2);font-size:14px}
.cl__lead select{width:100%;background:var(--ink);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:16px;padding:10px;min-height:46px}
.cl__lead .btn{margin-top:10px;min-height:46px}
.cl__pw{margin-top:12px;padding:12px;background:var(--ink);border:1px dashed var(--line2);font-family:ui-monospace,Menlo,monospace;font-size:20px;user-select:all;word-break:break-all}
.cl__toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--panel2);border-left:3px solid var(--red);padding:10px 14px;font-size:15px;max-width:calc(100vw - 32px);box-sizing:border-box}
.cl__in{width:100%;box-sizing:border-box;background:var(--ink);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:17px;padding:10px;min-height:46px}
.cl__link{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--redL);font:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;min-height:44px;cursor:pointer}
.cl__sample{margin-top:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
</style></head>
<body>
<main class="cl" id="cl" aria-live="polite"><p class="cl__empty">Loading…</p></main>
<script src="/assets/demo-data.js"></script>
<script src="/assets/demo-mock.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let MOCK = !!window.ARISE_FORCE_DEMO;
const S = { me: null, data: null, people: null, pending: null };

async function api(path, opts = {}) {
  const method = opts.method || 'GET';
  if (MOCK && window.AriseMock) {
    const r = await window.AriseMock.handle(method, path, opts.body);
    if (r && r.__status) throw Object.assign(new Error(r.error?.message || 'failed'), { status: r.__status });
    return r;
  }
  const res = await fetch('/api' + path, { method, credentials: 'same-origin', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let j = null; try { j = await res.json(); } catch {}
  if (!res.ok) throw Object.assign(new Error((j && (j.detail?.message || j.detail || j.message)) || res.statusText), { status: res.status });
  return j;
}
const toast = t => { const d = document.createElement('div'); d.className = 'cl__toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3600); };
const fmt = iso => { try { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); } catch { return ''; } };
const fmtCall = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); };

// Round 7, 162: after one full sign-in on this phone, a PIN for this page, on this phone. The phone
// remembers the name only (the PIN itself is never stored here; the server keeps a hash).
const PIN_KEY = 'arise.checklist.pin';
const pinUser = () => { try { return localStorage.getItem(PIN_KEY) || ''; } catch { return ''; } };
const setPinUser = u => { try { u ? localStorage.setItem(PIN_KEY, u) : localStorage.removeItem(PIN_KEY); } catch {} };

function signIn(msg, byPassword) {
  const remembered = pinUser(), byPin = !!remembered && !byPassword;
  $('#cl').innerHTML = `<div class="cl__top"><h1>Checklist</h1></div>
    <form class="cl__sign" id="sf"><h2>Sign in</h2><p>${byPin ? `Your PIN for this phone, <b>${esc(remembered)}</b>.` : "With your church account, the one you use on the Macs. This page shows your department's checklist for the next service."}</p>
      <label for="su"${byPin ? ' hidden' : ''}>Your name (first.last)</label><input id="su" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${esc(remembered)}"${byPin ? ' hidden' : ''}>
      ${byPin ? '<label for="sp">PIN</label><input id="sp" type="password" inputmode="numeric" maxlength="8" autocomplete="off" required>'
      : '<label for="sp">Password</label><input id="sp" type="password" autocomplete="current-password" required>'}
      <div id="sc" hidden><label for="scode">The six digits in Microsoft Authenticator</label><input id="scode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
      <div id="sn" hidden><label for="snew">Choose your own password</label><input id="snew" type="password" autocomplete="new-password"><p class="cl__by" id="snr"></p></div>
      <button class="btn" type="submit">Sign in</button><div class="cl__err" id="se">${esc(msg || '')}</div>
      ${remembered ? `<button class="cl__link" id="sw" type="button">${byPin ? 'Use my password instead' : 'Use my PIN'}</button>` : ''}
      ${MOCK ? '<div class="cl__sample">Preview: sample data, nothing leaves this page</div>' : ''}</form>`;
  const sw = $('#sw'); if (sw) sw.onclick = () => signIn('', byPin);
  $('#sp').focus();
  $('#sf').onsubmit = async e => {
    e.preventDefault(); $('#se').textContent = '';
    const user = $('#su').value.trim().toLowerCase(), pw = $('#sp').value;
    try {
      let r;
      if (S.pending) r = await api('/auth/login/code', { method: 'POST', body: { pending: S.pending, code: $('#scode').value.trim() } });
      else if (byPin) {
        try { r = await api('/auth/pin', { method: 'POST', body: { user, pin: pw } }); }
        catch (er) { $('#sp').value = ''; $('#se').textContent = er.message; if (/switched off|phone it was set on/.test(er.message)) { if (/phone it was set on/.test(er.message)) setPinUser(''); signIn(er.message, true); } return; }
      }
      else if (!$('#sn').hidden) r = await api('/auth/login/new-password', { method: 'POST', body: { user, old: pw, new: $('#snew').value } });
      else r = await api('/auth/login', { method: 'POST', body: { user, password: pw } });
      if (r.ok === false) { $('#se').textContent = r.err || 'That did not work'; return; }
      if (r.need_code) { S.pending = r.pending; $('#sc').hidden = false; $('#scode').focus(); return; }
      if (r.need_new_password) { $('#sn').hidden = false; $('#snr').textContent = (r.rules || []).join(' · '); $('#snew').focus(); return; }
      S.pending = null; load();
    } catch (er) { $('#se').textContent = er.status === 401 ? 'Wrong name or password' : er.message; }
  };
}

async function load() {
  try { S.data = await api('/checklist/mine'); }
  catch (e) { if (e.status === 401 || e.status === 403) return signIn(e.status === 403 ? e.message : ''); $('#cl').innerHTML = `<p class="cl__empty">${esc(e.message)}</p>`; return; }
  if (S.data.leads && S.data.leads.length) { try { S.people = await api('/checklist/people'); } catch { S.people = null; } }
  try { S.pin = await api('/auth/pin/status'); } catch { S.pin = null; }
  if (S.pin && S.pin.set && S.pin.this_device) setPinUser(S.pin.user);
  paint();
}

function paint() {
  const d = S.data, n = d.next;
  const lists = (d.lists || []).slice().sort((a, b) => (b.can_tick ? 1 : 0) - (a.can_tick ? 1 : 0));   // their own list first
  $('#cl').innerHTML = `<div class="cl__top"><h1>Checklist</h1><div class="who">${esc(d.user || '')}<br><button id="so" type="button">Sign out</button></div></div>
    ${n ? `<div class="cl__svc">Next: <b>${esc(n.name)}</b>${n.site ? ` · ${esc(n.site)}` : ''} · ${esc(n.day)} ${esc(fmtCall(n.time))}${d.call_time ? ` · call time <b>${esc(fmtCall(d.call_time))}</b>` : ''}</div>` : ''}
    ${lists.length ? lists.map(listHtml).join('') : '<p class="cl__empty">You are not in a department with a checklist. Ask your department leader or Bradly.</p>'}
    ${leaderHtml()}
    ${pinHtml()}
    ${MOCK ? '<div class="cl__sample">Preview: sample data, nothing leaves this page</div>' : ''}`;
  $('#so').onclick = async () => { try { await api('/auth/logout', { method: 'POST' }); } catch {} signIn(); };
  document.querySelectorAll('[data-tick]').forEach(b => b.onclick = () => tick(b.dataset.dept, +b.dataset.tick, b));
  const go = $('#lrGo'); if (go) go.onclick = leaderReset;
  const pg = $('#pinGo'); if (pg) pg.onclick = setPin;
}

// A staff PIN for this phone (162). Admins set theirs in My Profile on the desktop.
function pinHtml() {
  const st = S.pin; if (!st || st.kind !== 'checklist' || st.this_session_by_pin) return '';
  if (st.set && st.this_device && !st.off) return `<section class="cl__lead" id="pinBox"><h2>PIN for this phone</h2><p>On. Next time this phone asks for your PIN, not your password. Your password always works too.</p></section>`;
  return `<section class="cl__lead" id="pinBox"><h2>A PIN for this phone</h2><p>4 to 8 digits instead of your password, on this page and this phone only. Not one digit again and again, not a run like 1234, not your birthday.${st.set ? ' It replaces the PIN you set on another phone.' : ''}</p>
    <label for="pinA" class="cl__by">PIN</label><input id="pinA" class="cl__in" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <label for="pinB" class="cl__by">The same again</label><input id="pinB" class="cl__in" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    ${st.password_needed ? '<label for="pinPw" class="cl__by">Your password</label><input id="pinPw" class="cl__in" type="password" autocomplete="current-password">' : ''}
    <button class="btn" id="pinGo" type="button">Set the PIN</button><div id="pinOut"></div></section>`;
}
async function setPin() {
  const a = $('#pinA').value, b = $('#pinB').value, pw = $('#pinPw'), out = $('#pinOut');
  if (!/^\d{4,8}$/.test(a)) { out.innerHTML = '<div class="cl__err">A PIN is 4 to 8 digits, nothing else.</div>'; return; }
  if (a !== b) { out.innerHTML = '<div class="cl__err">The two PINs are not the same.</div>'; return; }
  const body = { pin: a }; if (pw) body.password = pw.value;
  $('#pinA').value = ''; $('#pinB').value = ''; if (pw) pw.value = '';
  try { const r = await api('/auth/pin/set', { method: 'POST', body });
    if (r.ok === false) { out.innerHTML = `<div class="cl__err">${esc(r.err)}</div>`; return; }
    setPinUser(S.data.user || (S.pin && S.pin.user)); toast('PIN set for this phone'); load(); }
  catch (e) { out.innerHTML = `<div class="cl__err">${esc(e.message)}</div>`; }
}

function listHtml(l) {
  const total = l.items.length, done = l.done || 0;
  const closed = l.open === false, can = l.can_tick && !closed;
  const note = closed ? `Opens at call time, ${esc(fmt(l.opens))}.` : !l.can_tick ? 'You can see this list; its own department ticks it.' : '';
  return `<section class="cl__list ${total && done === total ? 'done' : ''}"><h2>${esc(deptName(l.dept))}<small>${done} of ${total}</small></h2>
    ${note ? `<div class="cl__note">${note}</div>` : ''}
    ${l.items.map(i => `<button type="button" class="cl__item ${i.done ? 'on' : ''}" data-dept="${esc(l.dept)}" data-tick="${i.i}" ${can ? '' : 'disabled'} aria-pressed="${i.done}"><span class="cl__box" aria-hidden="true"></span><span><span class="cl__t">${esc(i.text)}</span>${i.done && i.by ? `<span class="cl__by">${esc(i.by)} · ${esc(fmt(i.at))}</span>` : ''}</span></button>`).join('') || '<p class="cl__empty">No items yet.</p>'}</section>`;
}

function leaderHtml() {
  const p = S.people; if (!p || !(S.data.leads || []).length) return '';
  return `<section class="cl__lead"><h2>Leader: reset a password</h2><p>For someone in ${esc(S.data.leads.map(deptName).join(', '))} who can't sign in. They get a temporary password and choose their own at the next sign-in.</p>
    ${p.people.length ? `<label for="lrUser" class="cl__by">Who</label><select id="lrUser">${p.people.map(u => `<option>${esc(u)}</option>`).join('')}</select><label for="lrPw" class="cl__by">Your own password (not a PIN)</label><input id="lrPw" class="cl__in" type="password" autocomplete="current-password"><button class="btn" id="lrGo" type="button">Reset their password</button>` : '<p>Nobody in your department to reset.</p>'}
    <div id="lrOut"></div></section>`;
}

const deptName = d => String(d || '').replace(/-/g, ' ').replace(/\bchildrens\b/i, "Children's");
async function tick(dept, i, btn) {
  btn.disabled = true;
  try { const r = await api(`/checklist/${encodeURIComponent(dept)}/tick`, { method: 'POST', body: { i } }); if (r.ok === false) { toast(r.err); btn.disabled = false; return; } await load(); }
  catch (e) { toast(e.message); btn.disabled = false; }
}

async function leaderReset() {
  const u = $('#lrUser').value, pw = $('#lrPw').value; $('#lrPw').value = '';
  if (!pw) { $('#lrOut').innerHTML = '<div class="cl__err">Type your own password first. A PIN never resets someone else.</div>'; return; }
  try {
    const r = await api('/checklist/reset', { method: 'POST', body: { user: u, password: pw } });
    if (r.ok === false) { $('#lrOut').innerHTML = `<div class="cl__err">${esc(r.err)}</div>`; return; }
    $('#lrOut').innerHTML = `<div class="cl__pw" aria-label="Temporary password">${esc(r.temporary_password)}</div><p class="cl__by">${esc(r.next)} It is shown once.</p>`;
  } catch (e) { $('#lrOut').innerHTML = `<div class="cl__err">${esc(e.message)}</div>`; }
}

// The preview has no server behind it: the page answers itself (web/demo-mock.js).
(async () => {
  if (!MOCK) { try { const r = await fetch('/api/health', { credentials: 'same-origin' }); if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) MOCK = true; } catch { MOCK = true; } }
  if (MOCK && !window.AriseMock) { $('#cl').innerHTML = '<p class="cl__empty">The server is not answering. On church Wi-Fi, or with Tailscale on, reload.</p>'; return; }
  load();
})();
})();
</script>
</body></html>
