// ariseos.cfg: the first line of an autoconfig file is always skipped, so it is this comment.
// Installed to <firefox>/ariseos.cfg by scripts/arise-browser-setup. Only what the
// enterprise policy cannot do lives here: the new-tab page. Checked against
// mozilla-firefox/firefox browser/modules/AboutNewTab.sys.mjs (the newTabURL setter).
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "http://127.0.0.1:4147/newtab.html";
} catch (e) {
  Components.utils.reportError("ariseOS: new tab page not set: " + e);
}
// The closet monitor's text size (round 5, 27): about 125%, read from the doorway. Firefox's own
// scale, so every click lands where it looks; Macs and phones are untouched (only arise-browser,
// the monitor's launcher, sets ARISE_KIOSK_SCALE). Settings -> The monitor changes it.
try {
  const s = getenv("ARISE_KIOSK_SCALE");
  if (s && /^\d(\.\d{1,2})?$/.test(s) && Number(s) >= 0.8 && Number(s) <= 1.6) pref("layout.css.devPixelsPerPx", s);
} catch (e) {
  Components.utils.reportError("ariseOS: monitor scale not set: " + e);
}
