name: frigate
title: Frigate NVR
description: Records the security cameras (ONVIF / RTSP) to the Synology, live views in a browser, motion and person detection, 24/7 or on events. Open source. The cameras must first have an address on the server's network (Network app > Find cameras says whether they do).
category: cameras
icon: screen
version: "0.14.1"
ports:
  - 8971:8971
  - 8554:8554
volumes:
  - /srv/arise/apps/frigate/config:/config
  - /mnt/synology/arise/cameras:/media/frigate
env: {}
autostart: false
ram_mb: 1500
limits:
  mem_mb: 3072
  cpus: 2.0
notes: |
  Before deploying: every camera needs an address on the server's network and
  an RTSP user. Network app > Find cameras lists what answers and whether it is
  reachable. Then write /srv/arise/apps/frigate/config/config.yml:
    mqtt: { enabled: false }
    cameras:
      front-door:
        ffmpeg:
          inputs:
            - path: rtsp://user:pass@192.168.x.y:554/Streaming/Channels/101
              roles: [record, detect]
        record: { enabled: true, retain: { days: 14, mode: motion } }
  Clips land on the Synology under arise/cameras; keep them out of the restic
  backup (they are big and the Synology's RAID holds them). Detection on CPU
  is slow with more than two cameras; a Coral USB accelerator (about $60, an
  estimate) fixes that.
