name: portainer
title: Portainer CE
description: Every container on the box with logs, a console and a stack editor, for the day the Apps page is not enough. Lightweight.
category: admin
icon: lock
version: "2.21.4"
ports:
  - 9443:9443
volumes:
  - /srv/arise/apps/portainer/data:/data
env: {}
notes: |
  https://arise-server:9443 (its own certificate; accept it once). Make the
  admin account within five minutes of the first start or it locks itself
  and needs a restart. Memory: under 100 MB (an estimate).
