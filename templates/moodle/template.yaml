name: moodle
title: Moodle
description: Courses with lessons, quizzes and completion tracking - a new-members track, volunteer onboarding, a study series. Heavy; deploy when someone will build a course.
category: learning
icon: folder
version: "5.0.2"
ports:
  - 8092:8080
volumes:
  - /srv/arise/apps/moodle/moodle:/bitnami/moodle
  - /srv/arise/apps/moodle/db:/bitnami/mariadb
env:
  DB_PASSWORD: CHANGE-ME
  MOODLE_PASSWORD: CHANGE-ME
autostart: false
ram_mb: 1200
limits:
  mem_mb: 2048
  cpus: 1.5
notes: |
  The first start takes several minutes (it installs itself). Memory 1 GB+
  for both (an estimate); 16 GB on the Dell, or run it alone. The LDAP
  authentication plugin connects it to the domain later.
