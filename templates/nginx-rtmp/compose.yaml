# nginx with the RTMP module: one stream in, many out. StreamYard already fans
# out to YouTube and Facebook, so this is for the case of an OBS encoder that
# must push once and have the server relay to YouTube, Facebook and Owncast.
# The relay targets are written in /srv/arise/apps/nginx-rtmp/nginx.conf.
# :latest because the image publishes no stable tags; pin after the first pull.
services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: arise-app-nginx-rtmp
    restart: unless-stopped
    ports:
      - "1936:1935"
      - "8088:80"
    volumes:
      - /srv/arise/apps/nginx-rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/arise/apps/nginx-rtmp/hls:/tmp/hls
    environment:
      - TZ=America/Chicago
